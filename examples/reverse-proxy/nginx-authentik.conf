# Single sign-on through Authentik's forward auth, for nginx (or Nginx Proxy Manager's Advanced tab).
# Browsers sign in through Authentik. Callers that send the hub token (Claude Code hooks, the Open WebUI
# tool, MCP clients) and /healthz skip it, and the hub checks their token itself.
# Replace AUTHENTIK_OUTPOST (host:port of your outpost), PROXY_SECRET_HERE (the same value as
# HUB_PROXY_SECRET on the hub) and the hub's address on the last line. See README.md beside this file.

proxy_buffers 8 16k;
proxy_buffer_size 32k;
client_max_body_size 200m;

# Authentik's outpost.
location /outpost.goauthentik.io {
    proxy_pass http://AUTHENTIK_OUTPOST/outpost.goauthentik.io;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    add_header Set-Cookie $auth_cookie;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

# Who may pass: token callers and the health check go straight to the hub
# (it checks the token itself, and a wrong token is refused even with a session cookie);
# everyone else asks Authentik. The browser's live stream goes through Authentik like the rest.
location = /_hub_auth {
    internal;
    if ($http_authorization ~* "^Bearer ") { return 204; }
    if ($request_uri ~ "^/healthz(\?|$)") { return 204; }
    proxy_pass http://AUTHENTIK_OUTPOST/outpost.goauthentik.io/auth/nginx;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location @sso_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}

location / {
    auth_request /_hub_auth;
    error_page 401 = @sso_signin;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $auth_cookie;
    auth_request_set $sso_user $upstream_http_x_authentik_username;

    # The signed-in user, vouched for by the shared secret (empty for token callers,
    # and a client's own X-Authentik-Username is always replaced).
    proxy_set_header X-Authentik-Username $sso_user;
    proxy_set_header X-Hub-Proxy-Secret "PROXY_SECRET_HERE";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    # Live updates (server-sent events) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://vb-ai-hub:8787;
}
