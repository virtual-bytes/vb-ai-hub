# VB AI Hub. Put HUB_TOKEN in .env next to this file, then run: docker compose up -d
# To run your own build instead of the published image, clone the repository and
# replace the image line with: build: .
services:
  vb-ai-hub:
    image: ghcr.io/virtual-bytes/vb-ai-hub:latest
    container_name: vb-ai-hub
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      HUB_TOKEN: ${HUB_TOKEN:?set HUB_TOKEN in .env}
      HUB_BACKUP_DIR: /backup
    volumes:
      - vb-ai-hub-data:/data
      - vb-ai-hub-backup:/backup

volumes:
  vb-ai-hub-data:
  vb-ai-hub-backup:
